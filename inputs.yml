# CueLane — inputs.yml v3
# Generated by Phase 3 — Spec-Driven Platform V31
# DO NOT edit manually. Regenerated from docs/PRODUCT.md via Phase 7 Feature Update.

app:
  name: CueLane
  slug: cuelane
  description: Smart Queue Management SaaS — multi-tenant, real-time queue orchestration
  version: "0.1.0"

apps:
  - name: web
    framework: nextjs
    port: 41716
    description: Admin portal, Customer Kiosk, Big Display, Employee Station (web views)
  - name: worker
    framework: node
    port: 41717
    description: BullMQ background job worker (email, reports, webhooks)

packages:
  - shared      # TypeScript types + Zod schemas
  - api-client  # tRPC client wrappers
  - db          # Prisma ORM + migrations + seed
  - ui          # shadcn/ui shared components
  - jobs        # BullMQ queue definitions
  - storage     # MinIO/S3 typed wrapper

tech_stack:
  language: typescript
  strict_mode: true
  frontend: nextjs_app_router
  api: trpc_v11
  orm: prisma
  auth: authjs_v5
  database: postgresql_16
  cache: valkey_7
  storage_dev: minio
  storage_prod: s3_or_r2
  job_queue: bullmq
  realtime: websocket_valkey_pubsub
  email: resend
  ui_library: shadcn_ui
  css: tailwind_css
  monorepo: turborepo
  package_manager: pnpm

tenancy:
  mode: multi
  routing: subdirectory          # /{tenant}/ path prefix
  tenant_field: tenant_id        # column on every entity
  shared_data:
    - subscription_plans          # global plan definitions
  upgrade_path: single_to_multi_ready

auth:
  providers:
    - email_password              # Tenant Admins, Super Admin
    - pin_credentials             # Employees (PIN + 4-digit code, no persistent session)
  session_strategy: jwt
  jwt_fields: [userId, tenantId, roles]
  employee_session: stateless_pin  # PIN verified per-request, no session cookie
  mfa: false
  email_verification: required_for_admin_registration
  password_reset: email_link_1hr

payment:
  gateway: xendit
  region: PH
  methods: [cards, e_wallets, bank_transfer, otc, qr_code]
  recurring: true                 # subscription via Xendit Plans API
  refunds: partial_and_full
  multi_currency: false
  default_currency: PHP
  webhook_queue: true             # receive → validate → enqueue → 200 immediately

storage:
  enabled: true
  provider_dev: minio
  provider_prod: s3_r2
  max_file_size_mb: 10
  allowed_mime_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    - video/mp4
    - application/pdf
  randomize_filenames: true
  path_pattern: "{tenantId}/{entityType}/{randomFilename}"
  svg_blocked: true
  html_blocked: true

jobs:
  enabled: true
  provider: bullmq
  queues:
    - name: email
      retries: 3
      backoff: exponential
      dlq: true
    - name: reports
      retries: 3
      backoff: exponential
      dlq: true
    - name: webhooks
      retries: 3
      backoff: exponential
      dlq: true
  tenant_scoped: true
  payload_fields: [tenantId, userId]

realtime:
  enabled: true
  transport: websocket
  pubsub: valkey
  channel_pattern: "tenant:{tenantId}:queue"
  events:
    - queue_called
    - queue_complete
    - queue_skipped
    - queue_updated
    - display_playlist_changed
    - employee_status_changed
  polling_fallback: false

email:
  provider: resend
  from_name: CueLane
  transactional:
    - email_verification
    - password_reset
    - subscription_confirmation
    - subscription_cancellation
    - subscription_renewal_reminder
  dev_intercept: mailhog

turnstile:
  enabled: true
  mode: managed
  protected_pages:
    - /login
    - /register
    - /forgot-password
  excluded_pages:
    - /{tenant}/kiosk    # Customer Kiosk — no Turnstile
    - /{tenant}/display  # Big Display — no Turnstile
  hostname_strategy: prod_only
  widget_count: 1

subscription_tiers:
  free:
    windows: 4
    transactions_per_day: 6
    employees: 10
    display_playlist_items: 3
    file_uploads: 1
    mobile_employee_app: false
    custom_theme: false
    advanced_reports: false
    file_storage_mb: 300
  premium:
    windows: unlimited
    transactions_per_day: unlimited
    employees: unlimited
    display_playlist_items: unlimited
    file_uploads: unlimited
    mobile_employee_app: true
    custom_theme: true
    advanced_reports: true
    file_storage_mb: unlimited

environments:
  - dev
  - staging
  - prod

domains:
  dev: "localhost:41716"
  staging: "cuelane-staging.powerbyte.app"
  prod: "cuelane.powerbyte.app"

cors:
  dev:
    - "http://localhost:41716"
    - "http://localhost:*"
  staging:
    - "https://cuelane-staging.powerbyte.app"
  prod:
    - "https://cuelane.powerbyte.app"

docker:
  publish: true
  registry: docker.io
  hub_repo: bonitobonita24/cuelane
  image_name: cuelane
  platforms:
    - linux/amd64
    - linux/arm64
  build_on_push_to: main
  dev_build: true

git:
  default_branch: main
  branch_pattern: feat/{slug}
  commit_style: conventional
  squash_merge: true
  use_worktrees: true

models:
  planning: claude-code
  execution: claude-sonnet-4-6
  governance: gemini-2.5-flash-lite

vibe_test:
  enabled: true

context7:
  enabled: true

accessibility:
  level: none

security:
  rate_limits:
    public: 30          # req/min per IP
    pin_auth: 10        # req/min per IP (lockout after 5 failed attempts)
    api: 120            # req/min per authenticated user
    upload: 20          # req/min per user
    password_reset: 5   # req/hour per email
  csrf: samesite_lax_trpc
  audit_events:
    - user_login
    - user_logout
    - tenant_created
    - tenant_settings_changed
    - employee_created
    - employee_deactivated
    - role_changed
    - window_opened
    - window_closed
    - queue_transaction_created
    - subscription_changed
    - file_uploaded
    - file_deleted
    - report_exported
    - webhook_received
    - payment_processed

ports:
  dev:
    base: 41706
    db: 41706
    pgbouncer: 41707
    redis: 41708
    minio: 41709
    minio_console: 41710
    mailhog_smtp: 41711
    mailhog_ui: 41712
    pgadmin: 41713
    app: 41716
    worker: 41717
    prisma_studio: 41726
