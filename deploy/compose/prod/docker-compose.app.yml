# ═══════════════════════════════════════════════════════════════════════
# CueLane — Production App Stack
# image: ONLY — pulls pre-built image from Docker Hub (NO build: key).
# Traefik handles HTTPS routing via the external proxy network.
#
# Usage (on production server — manual promotion ONLY):
#   docker compose -f deploy/compose/prod/docker-compose.app.yml \
#     --env-file .env.prod up -d
#
# PRODUCTION IS NEVER AUTO-DEPLOYED.
# Promote manually: bash deploy/compose/push.sh prod
# ═══════════════════════════════════════════════════════════════════════

name: cuelane_prod

services:

  # ── Next.js web app ──────────────────────────────────────────────────
  app:
    image: bonitobonita24/cuelane:${APP_IMAGE_TAG:-latest}
    container_name: cuelane_prod_app
    restart: unless-stopped
    mem_limit: 640m
    mem_reservation: 192m
    cpus: 1.0
    env_file: .env.prod
    networks:
      - cuelane_prod
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cuelane-prod.rule=Host(`cuelane.powerbyte.app`)"
      - "traefik.http.routers.cuelane-prod.entrypoints=websecure"
      - "traefik.http.routers.cuelane-prod.tls=true"
      - "traefik.http.routers.cuelane-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.cuelane-prod.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── BullMQ worker ────────────────────────────────────────────────────
  worker:
    image: bonitobonita24/cuelane-worker:${APP_IMAGE_TAG:-latest}
    container_name: cuelane_prod_worker
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    env_file: .env.prod
    command: ["node", "apps/worker/dist/index.js"]
    networks:
      - cuelane_prod

# ── Networks ─────────────────────────────────────────────────────────────
networks:
  cuelane_prod:
    name: cuelane_prod
    driver: bridge
  proxy:
    external: true
    name: proxy
