name: Build, Push & Deploy (staging)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: "Also promote+deploy PRODUCTION (manual gate)"
        type: boolean
        default: false

# ── CONFIG ───────────────────────────────────────────────────────────────────
env:
  IMAGE: bonitobonita24/cuelane
  KOMODO_STACK: cuelane-staging
  KOMODO_TAG_VAR: CUELANE_STAGING_TAG
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build-push-deploy:
    name: Build · Push · Deploy staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          SHA_TAG="sha-${GITHUB_SHA:0:7}"
          echo "sha=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push web (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}-worker:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}-worker:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Komodo (staging)
        env:
          KOMODO_HOST: https://kmd.powerbyte.app
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_STACK: ${{ env.KOMODO_STACK }}
          KOMODO_TAG_VAR: ${{ env.KOMODO_TAG_VAR }}
          IMAGE_TAG: ${{ steps.meta.outputs.sha }}
        run: bash deploy/komodo-deploy.sh
